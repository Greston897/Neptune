name: build

on:
  push:
    paths-ignore:
      - 'apk/**'
      - 'ci/**'
      - 'screenshots/**'
      - 'assets/**'
      - 'README.md'
  workflow_dispatch:
    inputs:
      shots:
        description: 'Capture UI screenshots on an emulator'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Android SDK packages
        run: |
          yes 2>/dev/null | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" > /dev/null 2>&1 || true

      - name: Signing key
        run: |
          if [ ! -f app/neptune.jks ]; then
            keytool -genkeypair -keystore app/neptune.jks -storepass neptune -keypass neptune \
              -alias neptune -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Neptune, OU=Player, O=Neptune, L=Leipzig, C=DE"
          fi

      - name: Assemble release APK
        run: |
          set -o pipefail
          gradle --no-daemon --console=plain assembleRelease 2>&1 | tee build.log | tail -n 100

      - name: Publish APK
        if: always()
        run: |
          set -x
          mkdir -p ci apk
          cp build.log ci/last-build.log 2>/dev/null || true
          find app/build/outputs -name '*.apk' -print -exec cp {} apk/Neptune.apk \; || true
          ls -la apk || true
          git config user.name "neptune-ci"
          git config user.email "ci@neptune.local"
          git add -f ci apk app/neptune.jks || true
          git commit -m "ci: apk + build log [skip ci]" || echo "nothing to commit"
          for i in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then echo "APK pushed"; break; fi
            sleep 5
          done

      - name: Enable KVM
        if: ${{ contains(github.event.head_commit.message, '[shots]') || (github.event_name == 'workflow_dispatch' && inputs.shots) }}
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Capture UI
        if: ${{ contains(github.event.head_commit.message, '[shots]') || (github.event_name == 'workflow_dispatch' && inputs.shots) }}
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            mkdir -p ci screenshots
            {
              set -x
              adb wait-for-device
              adb devices -l
              adb install -r apk/Neptune.apk
              shot() {
                adb shell am force-stop com.neptune.player
                sleep 2
                adb shell am start -W -n com.neptune.player/.MainActivity $1
                sleep 8
                adb exec-out screencap -p > "screenshots/$2.png"
              }
              shot "--es tab now --es playing true --ei track 0" 01-now
              shot "--es tab library" 02-library
              shot "--es tab search" 03-search
              shot "--es tab tune" 04-tune
              shot "--es tab now --es playing true --ei track 6 --ei position 96000" 05-now-amber
              adb shell wm size
              ls -la screenshots
              adb logcat -d -s AndroidRuntime:E | tail -n 80
            } 2>&1 | tee ci/shots.log
            exit 0

      - name: Publish screenshots
        if: always() && (contains(github.event.head_commit.message, '[shots]') || (github.event_name == 'workflow_dispatch' && inputs.shots))
        run: |
          set -x
          git add -f screenshots ci || true
          git commit -m "ci: ui screenshots [skip ci]" || echo "nothing to commit"
          for i in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then echo "shots pushed"; break; fi
            sleep 5
          done
