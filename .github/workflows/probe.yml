name: probe
on:
  push:
    paths: ['.github/workflows/probe.yml']
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          echo "JAVA:"; java -version 2>&1 || true
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls $ANDROID_HOME 2>/dev/null || true
          ls $ANDROID_HOME/platforms 2>/dev/null || true
          ls $ANDROID_HOME/build-tools 2>/dev/null || true
          echo "GRADLE:"; gradle -v 2>/dev/null || true
          nproc; free -g | head -2
